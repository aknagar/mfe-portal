apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
auth:
  secretStore: secretstore
spec:
  type: state.postgresql/v2
  version: v1
  metadata:
  - name: connectionString
    secretKeyRef:
      name: STATESTORE_CONNECTIONSTRING
      key: STATESTORE_CONNECTIONSTRING
  # useAzureAD=false in local dev (dockerised Postgres uses password auth).
  # In Azure (ACA) the component is provisioned via ConfigureInfrastructure
  # with useAzureAD=true — this YAML is only used by the Dapr CLI sidecar
  # during local development.
  - name: useAzureAD
    value: "false"
  - name: actorStateStore
    value: "true"
