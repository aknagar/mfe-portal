apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
auth:
  secretStore: secretstore
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    secretKeyRef:
      name: STATESTORE_REDISHOST
      key: STATESTORE_REDISHOST
  - name: redisPassword
    secretKeyRef:
      name: STATESTORE_REDISPASSWORD
      key: STATESTORE_REDISPASSWORD
  - name: actorStateStore
    value: "true"
