services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - devcontainer-bashhistory:/commandhistory
      - devcontainer-dotnet-nuget:/home/vscode/.nuget
      - devcontainer-node-modules:/home/vscode/.npm
    command: sleep infinity
    
    # Required for Docker-in-Docker
    privileged: true
    
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - create .devcontainer/.env file}
      - REDIS_HOST=redis
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    
    # No host port mapping needed - VS Code 'forwardPorts' in devcontainer.json handles port forwarding
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - create .devcontainer/.env file}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    # No host port mapping - accessible via service name 'postgres' within compose network
    # Use VS Code port forwarding if host access is needed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port mapping - accessible via service name 'redis' within compose network
    # Use VS Code port forwarding if host access is needed
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devcontainer-bashhistory:
  devcontainer-dotnet-nuget:
  devcontainer-node-modules:
  postgres-data:
  redis-data:
