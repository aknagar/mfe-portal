name: K6 Load Tests

on:
  # Run on demand
  workflow_dispatch:
    inputs:
      test_script:
        description: 'Test script to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - smoke-test.js
          - main.js
          - proxy-test.js
          - user-permissions-test.js
      load_level:
        description: 'Load level'
        required: false
        default: 'normal'
        type: choice
        options:
          - smoke
          - normal
          - stress
  
  # Run weekly on Sundays at 2 AM UTC
  schedule:
    - cron: '0 2 * * 0'
  
  # Run on PR when load test files change
  pull_request:
    paths:
      - 'backend/tests/k6/**'
      - '.github/workflows/k6-load-tests.yml'
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  load-test:
    name: K6 Load Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      matrix:
        test: 
          - ${{ github.event.inputs.test_script == 'all' && 'smoke-test.js' || github.event.inputs.test_script || 'smoke-test.js' }}
          - ${{ github.event.inputs.test_script == 'all' && 'main.js' || '' }}
          - ${{ github.event.inputs.test_script == 'all' && 'proxy-test.js' || '' }}
          - ${{ github.event.inputs.test_script == 'all' && 'user-permissions-test.js' || '' }}
        exclude:
          - test: ''
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET dependencies
        working-directory: ./backend
        run: dotnet restore MfePortal.Backend.sln

      - name: Build backend solution
        working-directory: ./backend
        run: dotnet build MfePortal.Backend.sln --no-restore --configuration Release

      - name: Install Aspire workload
        run: dotnet workload install aspire

      - name: Start Aspire AppHost
        working-directory: ./backend
        run: |
          echo "Starting Aspire AppHost in background..."
          dotnet run --project MfePortal.AppHost/MfePortal.AppHost.csproj --configuration Release &
          APPHOST_PID=$!
          echo "APPHOST_PID=$APPHOST_PID" >> $GITHUB_ENV
          
          echo "Waiting for services to be ready..."
          sleep 30
          
          # Health check retry logic
          max_attempts=12
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f -s http://localhost:5139/health > /dev/null 2>&1; then
              echo "✓ AugmentService is ready"
              break
            fi
            attempt=$((attempt + 1))
            echo "Waiting for services... ($attempt/$max_attempts)"
            sleep 5
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "Error: Services failed to start within timeout"
            exit 1
          fi

      - name: Verify services are running
        run: |
          echo "Checking service health..."
          curl -f http://localhost:5139/health || exit 1
          curl -f http://localhost:5139/alive || exit 1
          echo "✓ All services are healthy"

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run K6 Load Test - ${{ matrix.test }}
        working-directory: ./backend/tests/k6/scripts
        env:
          services__augmentservice__http__0: http://localhost:5139
          K6_OUT: json=../results/${{ matrix.test }}-results.json
        run: |
          echo "Running load test: ${{ matrix.test }}"
          
          # Adjust load based on input (if triggered manually)
          LOAD_LEVEL="${{ github.event.inputs.load_level || 'normal' }}"
          
          case "$LOAD_LEVEL" in
            smoke)
              echo "Running smoke test level..."
              k6 run --vus 1 --duration 30s --out json=../results/${{ matrix.test }}-results.json ${{ matrix.test }}
              ;;
            stress)
              echo "Running stress test level..."
              k6 run --vus 100 --duration 5m --out json=../results/${{ matrix.test }}-results.json ${{ matrix.test }}
              ;;
            *)
              echo "Running normal test level..."
              k6 run --out json=../results/${{ matrix.test }}-results.json ${{ matrix.test }}
              ;;
          esac

      - name: Generate test summary
        if: always()
        working-directory: ./backend/tests/k6/results
        run: |
          echo "## K6 Load Test Results - ${{ matrix.test }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "${{ matrix.test }}-results.json" ]; then
            echo "✓ Test completed successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Test artifacts have been uploaded for detailed analysis." >> $GITHUB_STEP_SUMMARY
          else
            echo "✗ Test failed or produced no results" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload K6 test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results-${{ matrix.test }}
          path: backend/tests/k6/results/*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-output-${{ matrix.test }}
          path: backend/tests/k6/results/*.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          echo "Stopping Aspire AppHost..."
          if [ -n "$APPHOST_PID" ]; then
            kill $APPHOST_PID || true
          fi
          
          # Kill any remaining dotnet processes
          pkill -f "dotnet.*MfePortal.AppHost" || true
          
          # Clean up Docker containers if any
          docker ps -q | xargs -r docker stop || true

  smoke-test:
    name: Quick Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and build
        working-directory: ./backend
        run: |
          dotnet restore MfePortal.Backend.sln
          dotnet build MfePortal.Backend.sln --no-restore --configuration Release

      - name: Install Aspire workload
        run: dotnet workload install aspire

      - name: Start services
        working-directory: ./backend
        run: |
          dotnet run --project MfePortal.AppHost/MfePortal.AppHost.csproj --configuration Release &
          sleep 30

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run smoke test only
        working-directory: ./backend/tests/k6/scripts
        env:
          services__augmentservice__http__0: http://localhost:5139
        run: |
          k6 run smoke-test.js
          
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### K6 Smoke Test Results ✅
            
            Smoke test passed successfully. Full load tests can be run manually via workflow dispatch.
            
            *Triggered by: @${{ github.actor }}*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  report:
    name: Generate Performance Report
    runs-on: ubuntu-latest
    needs: load-test
    if: always() && github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: test-results

      - name: Generate performance summary
        run: |
          echo "# K6 Load Test Performance Report" > report.md
          echo "" >> report.md
          echo "**Test Run:** ${{ github.run_number }}" >> report.md
          echo "**Triggered by:** ${{ github.event_name }}" >> report.md
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> report.md
          echo "" >> report.md
          echo "## Test Results" >> report.md
          echo "" >> report.md
          
          for dir in test-results/k6-results-*; do
            if [ -d "$dir" ]; then
              test_name=$(basename "$dir" | sed 's/k6-results-//')
              echo "### $test_name" >> report.md
              echo "✓ Test completed - see artifacts for detailed metrics" >> report.md
              echo "" >> report.md
            fi
          done
          
          cat report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: report.md
          retention-days: 90
