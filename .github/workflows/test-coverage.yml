name: Backend Test Coverage

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/test-coverage.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/test-coverage.yml'

jobs:
  test-coverage:
    name: Run Tests & Generate Coverage
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper coverage diff

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MfePortal.Backend.sln

      - name: Build solution
        run: dotnet build MfePortal.Backend.sln --no-restore --configuration Release

      - name: Run tests with coverage
        run: |
          dotnet test MfePortal.Backend.sln \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --settings coverlet.runsettings \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            "-reports:./TestResults/**/coverage.cobertura.xml" \
            "-targetdir:./TestResults/CoverageReport" \
            "-reporttypes:Html;HtmlSummary;Cobertura;JsonSummary;Badges;MarkdownSummary" \
            "-verbosity:Warning"

      - name: Parse coverage summary
        id: coverage
        run: |
          # Extract coverage from JSON summary
          COVERAGE_FILE=$(find ./TestResults/CoverageReport -name "Summary.json" | head -1)
          
          if [ -f "$COVERAGE_FILE" ]; then
            LINE_COVERAGE=$(cat "$COVERAGE_FILE" | jq -r '.summary.linecoverage')
            BRANCH_COVERAGE=$(cat "$COVERAGE_FILE" | jq -r '.summary.branchcoverage')
            
            echo "line_coverage=$LINE_COVERAGE" >> $GITHUB_OUTPUT
            echo "branch_coverage=$BRANCH_COVERAGE" >> $GITHUB_OUTPUT
            echo "coverage_file=$COVERAGE_FILE" >> $GITHUB_OUTPUT
            
            echo "### Coverage Summary 📊" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Line Coverage:** $LINE_COVERAGE%" >> $GITHUB_STEP_SUMMARY
            echo "- **Branch Coverage:** $BRANCH_COVERAGE%" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Coverage summary file not found" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/TestResults/CoverageReport/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/TestResults/*.trx
          retention-days: 30

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const lineCoverage = '${{ steps.coverage.outputs.line_coverage }}';
            const branchCoverage = '${{ steps.coverage.outputs.branch_coverage }}';
            
            // Read markdown summary if exists
            const summaryPath = './backend/TestResults/CoverageReport/Summary.md';
            let markdownSummary = '';
            
            if (fs.existsSync(summaryPath)) {
              markdownSummary = fs.readFileSync(summaryPath, 'utf8');
            }
            
            const coverageIcon = parseFloat(lineCoverage) >= 80 ? '✅' : '⚠️';
            
            const body = `## ${coverageIcon} Test Coverage Report
            
            ### Overall Coverage
            
            | Metric | Coverage |
            |--------|----------|
            | **Lines** | ${lineCoverage}% |
            | **Branches** | ${branchCoverage}% |
            
            ### Status
            
            ${parseFloat(lineCoverage) >= 80 ? '✅ Coverage meets threshold (80%)' : '⚠️ Coverage below threshold (80%)'}
            
            <details>
            <summary>📋 Detailed Coverage Report</summary>
            
            ${markdownSummary || 'Full report available in artifacts'}
            
            </details>
            
            ---
            
            💡 **Tip:** Download the full HTML coverage report from the workflow artifacts.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Check coverage threshold
        run: |
          LINE_COVERAGE="${{ steps.coverage.outputs.line_coverage }}"
          THRESHOLD=80
          
          echo "Line Coverage: $LINE_COVERAGE%"
          echo "Threshold: $THRESHOLD%"
          
          if (( $(echo "$LINE_COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ($LINE_COVERAGE%) is below threshold ($THRESHOLD%)"
            exit 1
          else
            echo "✅ Coverage ($LINE_COVERAGE%) meets threshold ($THRESHOLD%)"
          fi

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            backend/TestResults/**/*.trx
          check_name: Backend Test Results
          comment_mode: off
