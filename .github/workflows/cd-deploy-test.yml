name: CD - Deploy to Test Environment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Container image tag to deploy'
        required: true
        default: 'latest'
        type: string
      run_id:
        description: 'Build workflow run ID'
        required: false
        type: string
  workflow_call:
    inputs:
      image_tag:
        description: 'Container image tag to deploy'
        required: true
        type: string
      run_id:
        description: 'Build workflow run ID'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  deploy:
    name: Deploy to Test
    runs-on: ubuntu-latest
    environment: test
    
    defaults:
      run:
        working-directory: ./backend
    
    outputs:
      deployment_url: ${{ steps.get_url.outputs.url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download package artifacts
        if: inputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: aspire-package-${{ inputs.image_tag }}
          path: backend/dist/
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login \
            --client-id "${{ env.AZURE_CLIENT_ID }}" \
            --federated-credential-provider github \
            --tenant-id "${{ env.AZURE_TENANT_ID }}"

      - name: Create and select azd environment
        run: |
          # Create new environment if it doesn't exist
          azd env new "${{ env.AZURE_ENV_NAME }}" --no-prompt || true
          # Select the environment
          azd env select "${{ env.AZURE_ENV_NAME }}"
          # Initialize required variables
          azd env set AZURE_RESOURCE_GROUP "${{ env.AZURE_RESOURCE_GROUP }}"
          azd env set AZURE_LOCATION "${{ env.AZURE_LOCATION }}"
          azd env set AZURE_SUBSCRIPTION_ID "${{ env.AZURE_SUBSCRIPTION_ID }}"

      - name: Verify environment initialization
        run: |
          echo "Environment variables for '${{ env.AZURE_ENV_NAME }}':"
          azd env get-values

      - name: Deploy application
        id: deploy
        run: |
          echo "### 🚀 Deploying to Test Environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ env.AZURE_ENV_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Location:** ${{ env.AZURE_LOCATION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Resource Group:** ${{ env.AZURE_RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "./dist" ] && [ -f "./dist/manifest.json" ]; then
            echo "Deploying from package..."
            azd deploy --from-package ./dist --no-prompt
          else
            echo "Package not found, deploying with azd up..."
            azd up --no-prompt
          fi

      - name: Get deployment outputs
        id: get_url
        run: |
          echo "Deployment outputs:"
          azd env get-values | tee deployment-outputs.log
          
          # Try to extract the app URL if available
          if grep -q "APP_URL" deployment-outputs.log; then
            APP_URL=$(grep "APP_URL" deployment-outputs.log | cut -d'=' -f2 | tr -d '"')
            echo "url=$APP_URL" >> $GITHUB_OUTPUT
            echo "Deployment URL: $APP_URL"
          fi

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs-test-${{ inputs.image_tag }}
          path: backend/deployment-outputs.log
          retention-days: 30

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Wait for application startup
        run: |
          echo "Waiting 60 seconds for application to start..."
          sleep 60

      - name: Check deployment health
        id: health_check
        run: |
          APP_URL="${{ needs.deploy.outputs.deployment_url }}"
          
          if [ -z "$APP_URL" ]; then
            echo "⚠️ Deployment URL not found, skipping health check"
            echo "Please verify deployment manually in Azure Portal"
            exit 0
          fi
          
          echo "Checking health endpoint: $APP_URL/health"
          
          MAX_RETRIES=3
          RETRY_DELAY=30
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES..."
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$APP_URL/health" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)"
              echo "### ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "- **Status:** Healthy" >> $GITHUB_STEP_SUMMARY
              echo "- **URL:** $APP_URL" >> $GITHUB_STEP_SUMMARY
              echo "- **Health Endpoint:** $APP_URL/health" >> $GITHUB_STEP_SUMMARY
              exit 0
            else
              echo "⚠️ Health check failed (HTTP $HTTP_CODE)"
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Retrying in $RETRY_DELAY seconds..."
                sleep $RETRY_DELAY
              fi
            fi
          done
          
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          echo "### ⚠️ Deployment Warning" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployment completed but health check failed." >> $GITHUB_STEP_SUMMARY
          echo "Please verify the application manually in Azure Portal." >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          echo "### 📊 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Test |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${{ inputs.image_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment Time | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
