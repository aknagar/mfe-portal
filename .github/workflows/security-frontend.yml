name: Security - Frontend Dependency Scan

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**/package.json'
      - 'frontend/**/package-lock.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**/package.json'
      - 'frontend/**/package-lock.json'
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
          fail-on-severity: high
          comment-summary-in-pr: always

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        project:
          - name: shell
            path: frontend/shell
          - name: hello-world-pilet
            path: frontend/pilets/hello-world-pilet
          - name: url-getter-pilet
            path: frontend/pilets/url-getter-pilet
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit
        working-directory: ${{ matrix.project.path }}
        run: |
          echo "Running npm audit for ${{ matrix.project.name }}..."
          npm audit --audit-level=moderate --json > audit-results.json || true
          
          # Parse results
          VULNERABILITIES=$(cat audit-results.json | jq -r '.metadata.vulnerabilities | to_entries[] | "\(.key): \(.value)"')
          
          echo "### 🔍 NPM Audit Results - ${{ matrix.project.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$VULNERABILITIES" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.project.name }}
          path: ${{ matrix.project.path }}/audit-results.json
          retention-days: 30

  outdated-check:
    name: Check Outdated Packages
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check shell outdated packages
        working-directory: ./frontend/shell
        run: |
          npm outdated --json > outdated.json || true
          
          echo "### 📦 Outdated Packages - Shell" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -s outdated.json ] && [ "$(cat outdated.json)" != "{}" ]; then
            echo "The following packages have updates available:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat outdated.json | jq >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All packages are up to date!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check pilets outdated packages
        working-directory: ./frontend/pilets/hello-world-pilet
        run: |
          npm outdated --json > outdated.json || true
          
          echo "### 📦 Outdated Packages - hello-world-pilet" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -s outdated.json ] && [ "$(cat outdated.json)" != "{}" ]; then
            echo "The following packages have updates available:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat outdated.json | jq >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All packages are up to date!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create issue if major updates found
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // Check if any outdated.json files exist with content
            let hasOutdated = false;
            try {
              const shellOutdated = fs.readFileSync('./frontend/shell/outdated.json', 'utf8');
              if (shellOutdated && shellOutdated !== '{}') {
                hasOutdated = true;
              }
            } catch (e) {
              // File doesn't exist or is empty
            }
            
            if (hasOutdated) {
              // Create or update issue
              const title = '📦 Weekly Dependency Update Check';
              const body = `## Outdated Frontend Dependencies Detected
              
              Our weekly dependency scan has found packages that have updates available.
              
              ### Next Steps
              
              1. Review the outdated packages in the [workflow run summary](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})
              2. Update packages incrementally, testing after each update
              3. Pay special attention to major version updates
              
              ### Update Commands
              
              \`\`\`bash
              cd frontend/shell
              npm update  # Update to latest within semver range
              npm outdated  # Check what else can be updated
              \`\`\`
              
              For major version updates:
              \`\`\`bash
              npm install package@latest
              \`\`\`
              
              ---
              
              *This issue was automatically created by the dependency scan workflow.*
              `;
              
              // Search for existing issue
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: ['dependencies', 'automated']
              });
              
              const existingIssue = issues.find(issue => issue.title === title);
              
              if (existingIssue) {
                // Update existing issue
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  body: `Updated: ${new Date().toISOString()}\n\n${body}`
                });
              } else {
                // Create new issue
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body,
                  labels: ['dependencies', 'automated']
                });
              }
            }
