name: CI - Frontend PR Validation

on:
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend-pr-validation.yml'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/shell/package-lock.json'

      - name: Install shell dependencies
        working-directory: ./frontend/shell
        run: npm ci

      - name: Type check shell
        working-directory: ./frontend/shell
        run: npx tsc --noEmit

      - name: Build shell
        working-directory: ./frontend/shell
        run: npm run build

      - name: Validate shell
        working-directory: ./frontend/shell
        run: npm run validate

      - name: Build hello-world-pilet
        working-directory: ./frontend/pilets/hello-world-pilet
        run: |
          npm ci
          npm run build

      - name: Build url-getter-pilet
        working-directory: ./frontend/pilets/url-getter-pilet
        run: |
          npm ci
          npm run build

      - name: Check bundle sizes
        working-directory: ./frontend/shell
        run: |
          SHELL_SIZE=$(du -sh dist | cut -f1)
          echo "### 📦 Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Shell | $SHELL_SIZE |" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "../pilets/hello-world-pilet/dist" ]; then
            HELLO_SIZE=$(du -sh ../pilets/hello-world-pilet/dist | cut -f1)
            echo "| Hello World Pilet | $HELLO_SIZE |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -d "../pilets/url-getter-pilet/dist" ]; then
            URL_SIZE=$(du -sh ../pilets/url-getter-pilet/dist | cut -f1)
            echo "| URL Getter Pilet | $URL_SIZE |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload shell artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shell-build-pr-${{ github.event.pull_request.number }}
          path: frontend/shell/dist/
          retention-days: 7

      - name: Upload pilet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pilets-build-pr-${{ github.event.pull_request.number }}
          path: |
            frontend/pilets/*/dist/
          retention-days: 7

      - name: Comment PR with build status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `## ✅ Frontend Build Successful
            
            ### Build Status
            
            - ✅ Shell application built successfully
            - ✅ Type checking passed
            - ✅ Piral validation passed
            - ✅ All pilets built successfully
            
            ### Components Built
            
            - 🏠 **Shell** - Main Piral application
            - 📦 **hello-world-pilet** - Demo pilet
            - 📦 **url-getter-pilet** - Tools pilet
            
            ### Artifacts
            
            Build artifacts are available for download in the workflow run.
            
            ---
            
            💡 **Next Steps:** Run E2E tests to verify integration
            `;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Frontend Build Successful')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/shell/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend/shell
        run: npm ci

      - name: Check formatting (if configured)
        working-directory: ./frontend/shell
        run: |
          if [ -f ".prettierrc" ] || [ -f ".prettierrc.json" ]; then
            npx prettier --check "src/**/*.{ts,tsx,css,json}"
          else
            echo "Prettier not configured, skipping format check"
          fi
        continue-on-error: true

      - name: ESLint check (if configured)
        working-directory: ./frontend/shell
        run: |
          if [ -f ".eslintrc.json" ] || [ -f "eslint.config.js" ]; then
            npx eslint "src/**/*.{ts,tsx}"
          else
            echo "ESLint not configured, skipping lint check"
          fi
        continue-on-error: true
