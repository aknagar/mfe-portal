name: CI - Frontend E2E Tests

on:
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/shell/package-lock.json'

      - name: Install shell dependencies
        working-directory: ./frontend/shell
        run: npm ci

      - name: Build shell for testing
        working-directory: ./frontend/shell
        run: npm run build

      - name: Install pilet dependencies and build
        run: |
          cd pilets/hello-world-pilet
          npm ci
          npm run build
          
          cd ../url-getter-pilet
          npm ci
          npm run build

      - name: Install Playwright dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start shell in background
        working-directory: ./frontend/shell
        run: |
          npm run start:1234 &
          echo $! > .shell-pid
          
          # Wait for server to be ready
          echo "Waiting for shell to start on http://localhost:1234..."
          for i in {1..30}; do
            if curl -s http://localhost:1234 > /dev/null; then
              echo "Shell is ready!"
              break
            fi
            echo "Attempt $i/30: Shell not ready yet..."
            sleep 2
          done

      - name: Run Playwright tests
        run: npx playwright test --reporter=list,html

      - name: Stop shell
        if: always()
        working-directory: ./frontend/shell
        run: |
          if [ -f .shell-pid ]; then
            kill $(cat .shell-pid) || true
            rm .shell-pid
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: frontend/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ github.run_number }}
          path: frontend/test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const testStatus = '${{ job.status }}';
            const testIcon = testStatus === 'success' ? '✅' : '❌';
            
            const body = `## ${testIcon} E2E Test Results
            
            ### Test Status: ${testStatus === 'success' ? 'Passed' : 'Failed'}
            
            ${testStatus === 'success' 
              ? '✅ All Playwright E2E tests passed successfully!' 
              : '❌ Some E2E tests failed. Please review the test report.'}
            
            ### Test Environment
            
            - **Browser:** Chromium
            - **Base URL:** http://localhost:1234
            - **Retries:** 2 (CI mode)
            
            ### Artifacts
            
            - 📊 Playwright HTML report available in workflow artifacts
            - 📸 Screenshots and traces (if any failures)
            
            ---
            
            💡 **Tip:** Download the Playwright report artifact to see detailed test results with screenshots and traces.
            `;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('E2E Test Results')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Publish test summary
        if: always()
        run: |
          echo "### 🎭 Playwright E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | Chromium |" >> $GITHUB_STEP_SUMMARY
          echo "| Retries | 2 |" >> $GITHUB_STEP_SUMMARY
          echo "| Workers | 1 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full test report available in artifacts." >> $GITHUB_STEP_SUMMARY
