name: Infrastructure Provision - Production

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      AZURE_ENV_NAME: prod      
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
      AZURE_CONTAINER_REGISTRY_ENDPOINT: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire workload
        run: dotnet workload install aspire
        shell: pwsh

      - name: Install Aspire CLI
        run: dotnet tool install -g Aspire.Cli --prerelease
        shell: pwsh

      - name: Install Dapr CLI
        uses: dapr/setup-dapr@v2

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy with Aspire
        working-directory: ./backend/MfePortal.AppHost
        # The Aspire CLI discovers Azure Container Apps environment from the AppHost project
        # configuration (AddAzureContainerAppEnvironment) and uses Azure login context.
        # The --environment parameter specifies the deployment environment (Test/Production).
        # Environment variables below are used by Aspire to configure the Azure deployment:
        # - AZURE_SUBSCRIPTION_ID: Target Azure subscription
        # - AZURE_ENV_NAME: Environment name (e.g., test, production)
        # - AZURE_RESOURCE_GROUP: Resource group for Container Apps
        # - AZURE_LOCATION: Azure region (e.g., centralindia)
        run: aspire deploy --environment $env:AZURE_ENV_NAME
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ env.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ env.AZURE_LOCATION }}
