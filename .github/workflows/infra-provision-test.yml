name: Infrastructure Provision - Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 100
    env:
      AZURE_ENV_NAME: test
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}      
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_REGISTRY_ENDPOINT: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
      # Aspire CLI non-interactive mode: prevents process-parameters step from blocking on stdin
      DOTNET_ASPIRE_NONINTERACTIVE: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire workload
        timeout-minutes: 10
        run: dotnet workload install aspire

      - name: Install Aspire CLI
        timeout-minutes: 5
        run: dotnet tool install -g Aspire.Cli --version 13.1.2

      - name: Install Dapr CLI
        uses: dapr/setup-dapr@v2      

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy with Aspire
        timeout-minutes: 90
        working-directory: ./backend/MfePortal.AppHost
        run: |
          aspire deploy \
            --environment $AZURE_ENV_NAME \
            --log-level debug \
            --include-exception-details \
            --parameter postgres-password="${{ secrets.POSTGRES_PASSWORD }}" \
            --parameter redis-password="${{ secrets.REDIS_PASSWORD }}"
        env:
          # Note: Colon (:) is not supported in environment variable names
          # Use double underscore (__) instead. For example: Azure__SubscriptionId
          Azure__SubscriptionId: ${{ env.AZURE_SUBSCRIPTION_ID }}
          Azure__ResourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          Azure__Location: ${{ env.AZURE_LOCATION }}
