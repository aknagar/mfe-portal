name: Infrastructure Provision - Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_REGISTRY_ENDPOINT: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire workload
        run: dotnet workload install aspire
        shell: pwsh

      - name: Install Dapr CLI
        uses: dapr/setup-dapr@v2

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy with Aspire
        working-directory: ./backend/MfePortal.AppHost
        run: |
          aspire deploy `
            --environment-name "${{ env.AZURE_ENV_NAME }}" `
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" `
            --location "${{ env.AZURE_LOCATION }}" `
            --subscription-id "${{ env.AZURE_SUBSCRIPTION_ID }}"
        shell: pwsh

      - name: Get deployment outputs
        run: |
          az deployment group show `
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" `
            --name "${{ env.AZURE_ENV_NAME }}" `
            --query properties.outputs
        shell: pwsh

      - name: Provision summary
        run: |
          echo "Azure infrastructure provisioned successfully"
          echo "Environment: ${{ env.AZURE_ENV_NAME }}"
          echo "Resource Group: ${{ env.AZURE_RESOURCE_GROUP }}"
          echo "Location: ${{ env.AZURE_LOCATION }}"
          echo "Check Azure Portal for resource details"
        shell: bash
