name: CD - Backend Deploy to Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  # Aspire CLI non-interactive mode: prevents process-parameters step from blocking on stdin
  DOTNET_ASPIRE_NONINTERACTIVE: "true"

jobs:
  deploy:
    name: Deploy to Test
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend
    
    outputs:
      deployment_url: ${{ steps.get_url.outputs.url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Aspire workload
        run: dotnet workload install aspire
        shell: bash

      - name: Install Aspire CLI
        timeout-minutes: 5
        run: dotnet tool install --global Aspire.Cli --version 13.2.0

      - name: Install Dapr CLI
        uses: dapr/setup-dapr@v2

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy application
        id: deploy
        working-directory: ./backend/MfePortal.AppHost
        run: |
          echo "### 🚀 Deploying to Test Environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ env.AZURE_ENV_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Location:** ${{ env.AZURE_LOCATION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Resource Group:** ${{ env.AZURE_RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # --non-interactive prevents any prompts from blocking the pipeline.
          # DOTNET_ASPIRE_NONINTERACTIVE env var is also set as a belt-and-suspenders guard.
          # --log-level trace and --include-exception-details added to diagnose pipeline hang.
          aspire deploy \
            --environment-name "${{ env.AZURE_ENV_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --location "${{ env.AZURE_LOCATION }}" \
            --subscription-id "${{ env.AZURE_SUBSCRIPTION_ID }}" \
            --non-interactive \
            --log-level trace \
            --include-exception-details \
            --parameter postgres-password="${{ secrets.POSTGRES_PASSWORD }}" \
            --parameter redis-password="${{ secrets.REDIS_PASSWORD }}"
        env:
          # Note: Colon (:) is not supported in environment variable names
          # Use double underscore (__) instead. For example: Azure__SubscriptionId
          Azure__SubscriptionId: ${{ env.AZURE_SUBSCRIPTION_ID }}
          Azure__ResourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          Azure__Location: ${{ env.AZURE_LOCATION }}

      - name: Get deployment outputs
        id: get_url
        run: |
          echo "Querying deployment outputs from Azure..."
          
          # Query deployment outputs from Azure
          OUTPUTS=$(az deployment group show \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_ENV_NAME }}" \
            --query properties.outputs \
            --output json 2>/dev/null || echo '{}')
          
          echo "$OUTPUTS" | tee deployment-outputs.log
          
          # Try to extract app URL from common output key names
          APP_URL=$(echo "$OUTPUTS" | \
            python3 -c "import sys, json; d = json.load(sys.stdin); \
              keys = [k for k in d if 'url' in k.lower() or 'endpoint' in k.lower()]; \
              print(d[keys[0]]['value'] if keys else '')" 2>/dev/null || echo "")
          
          if [ -n "$APP_URL" ]; then
            echo "Found deployment URL: $APP_URL"
            echo "url=$APP_URL" >> $GITHUB_OUTPUT
          else
            echo "No URL found in deployment outputs"
          fi

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs-test-${{ inputs.image_tag }}
          path: backend/deployment-outputs.log
          retention-days: 30

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Wait for application startup
        run: |
          echo "Waiting 60 seconds for application to start..."
          sleep 60

      - name: Check deployment health
        id: health_check
        run: |
          APP_URL="${{ needs.deploy.outputs.deployment_url }}"
          
          if [ -z "$APP_URL" ]; then
            echo "⚠️ Deployment URL not found, skipping health check"
            echo "Please verify deployment manually in Azure Portal"
            exit 0
          fi
          
          echo "Checking health endpoint: $APP_URL/health"
          
          MAX_RETRIES=3
          RETRY_DELAY=30
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES..."
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$APP_URL/health" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)"
              echo "### ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "- **Status:** Healthy" >> $GITHUB_STEP_SUMMARY
              echo "- **URL:** $APP_URL" >> $GITHUB_STEP_SUMMARY
              echo "- **Health Endpoint:** $APP_URL/health" >> $GITHUB_STEP_SUMMARY
              exit 0
            else
              echo "⚠️ Health check failed (HTTP $HTTP_CODE)"
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Retrying in $RETRY_DELAY seconds..."
                sleep $RETRY_DELAY
              fi
            fi
          done
          
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          echo "### ⚠️ Deployment Warning" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployment completed but health check failed." >> $GITHUB_STEP_SUMMARY
          echo "Please verify the application manually in Azure Portal." >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          echo "### 📊 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Test |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${{ inputs.image_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment Time | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
