name: CD - Frontend Deploy to Test

on:
  workflow_dispatch:
    inputs:
      artifact_version:
        description: 'Artifact version to deploy (from CI build)'
        required: false
        type: string
  workflow_call:
    inputs:
      artifact_version:
        description: 'Artifact version to deploy'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
  IMAGE_NAME: mfe-portal-frontend
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  build-and-push:
    name: Build & Push Container
    runs-on: ubuntu-latest
    
    outputs:
      image_tag: ${{ steps.image_tag.outputs.tag }}
      image_uri: ${{ steps.image_tag.outputs.uri }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download shell artifacts
        if: inputs.artifact_version != ''
        uses: actions/download-artifact@v4
        with:
          name: shell-${{ inputs.artifact_version }}
          path: frontend/shell/dist/
        continue-on-error: true

      - name: Build frontend if artifacts not found
        if: inputs.artifact_version == '' || steps.download-shell.outcome == 'failure'
        working-directory: ./frontend/shell
        run: |
          npm ci
          npm run build

      - name: Generate image tag
        id: image_tag
        run: |
          if [ -n "${{ inputs.artifact_version }}" ]; then
            TAG="${{ inputs.artifact_version }}"
          else
            TAG="${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "uri=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG" >> $GITHUB_OUTPUT
          echo "### 🏷️ Container Image Tag: \`$TAG\`" >> $GITHUB_STEP_SUMMARY

      - name: Create Dockerfile
        working-directory: ./frontend
        run: |
          cat > Dockerfile.frontend <<EOF
          FROM nginx:alpine
          
          # Copy built shell
          COPY shell/dist /usr/share/nginx/html
          
          # Copy pilets (if available)
          COPY pilets/*/dist /usr/share/nginx/html/pilets/ 2>/dev/null || true
          
          # Custom nginx config for SPA
          RUN echo 'server {
              listen 80;
              location / {
                  root /usr/share/nginx/html;
                  try_files \$uri \$uri/ /index.html;
              }
          }' > /etc/nginx/conf.d/default.conf
          
          EXPOSE 80
          CMD ["nginx", "-g", "daemon off;"]
          EOF

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: |
          # az acr login --name expects just the registry name, not the full FQDN
          REGISTRY_NAME=$(echo "${{ env.REGISTRY }}" | cut -d'.' -f1)
          az acr login --name "$REGISTRY_NAME"

      - name: Build and push container image
        working-directory: ./frontend
        run: |
          docker build -f Dockerfile.frontend -t ${{ steps.image_tag.outputs.uri }} .
          docker push ${{ steps.image_tag.outputs.uri }}
          
          # Also tag as latest for test environment
          docker tag ${{ steps.image_tag.outputs.uri }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          echo "### 📦 Container Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ steps.image_tag.outputs.uri }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Also tagged: \`latest\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Test
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps (if exists)
        run: |
          # Check if container app exists
          APP_EXISTS=$(az containerapp show \
            --name mfe-portal-frontend-test \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query name -o tsv 2>/dev/null || echo "")
          
          if [ -n "$APP_EXISTS" ]; then
            echo "Updating existing container app..."
            az containerapp update \
              --name mfe-portal-frontend-test \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --image ${{ needs.build-and-push.outputs.image_uri }}
            
            echo "### ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Frontend deployed to Azure Container Apps" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ Container app 'mfe-portal-frontend-test' not found" >> $GITHUB_STEP_SUMMARY
            echo "Image pushed to ACR but not deployed. Create container app manually or use Aspire." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Deployment summary
        run: |
          echo "### 📊 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Test |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ${{ needs.build-and-push.outputs.image_uri }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed By | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
